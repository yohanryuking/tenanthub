name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npx ng build

      - name: Install Chrome for headless tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

  deploy:
    # Same gating as backend-ci.yml's deploy job — see docs/deploy.md.
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret not set — skipping deploy. See docs/deploy.md."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
