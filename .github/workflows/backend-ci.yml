name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenanthub_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tenanthub_dev
      APP_DATABASE_URL: postgresql://tenanthub_app:tenanthub_app@localhost:5432/tenanthub_dev
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 15m

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Apply migrations (creates schema, RLS policies, and the tenanthub_app role)
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Negative RLS tests (real Postgres)
        run: npm run test:e2e

  deploy:
    # Only runs after `test` passes, and only for pushes to main — this is
    # what "gated by the existing tests" means here. See docs/deploy.md:
    # until RENDER_DEPLOY_HOOK is set as a repo secret this step is a
    # deliberate no-op, not a failure, so CI stays green before hosting is
    # actually set up.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping deploy. See docs/deploy.md."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
