<div class="auth-card">
  <h1>Creá tu organización</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nombre de la organización
      <input
        type="text"
        formControlName="orgName"
        (input)="onOrgNameChange($any($event.target).value)"
        placeholder="Acme Inc"
      />
    </label>

    <label>
      Slug (identifica tu organización en la URL de login)
      <input type="text" formControlName="orgSlug" placeholder="acme-inc" />
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creando…' : 'Crear organización' }}
    </button>
  </form>

  <p class="switch">
    ¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a>
  </p>
</div>
